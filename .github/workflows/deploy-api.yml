name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - apps/api/fly.toml
      - .github/workflows/deploy-api.yml

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0 # Full history for sentry-cli commit association

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run DB migrations
        run: cd packages/db && pnpm dlx tsx src/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply post-migration indexes
        run: node packages/db/scripts/post-migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Set release version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "RELEASE_VERSION=pawmeet-api@${SHORT_SHA}" >> "$GITHUB_ENV"

      - uses: superfly/flyctl-actions/setup-flyctl@63da3ecc5e2793b98a3f2519b3d75d4f4c11cec2 # master 2026-03-20

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --config apps/api/fly.toml --build-arg "APP_VERSION=${RELEASE_VERSION}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli@3.3.3 releases new "${RELEASE_VERSION}"
          npx @sentry/cli@3.3.3 releases set-commits "${RELEASE_VERSION}" --auto
          npx @sentry/cli@3.3.3 releases deploys "${RELEASE_VERSION}" new -e production
          npx @sentry/cli@3.3.3 releases finalize "${RELEASE_VERSION}"
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_API }}
