<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="paw" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)" rx="0" ry="0"/>

  <!-- Paw main pad -->
  <ellipse cx="512" cy="600" rx="155" ry="140" fill="url(#paw)"/>

  <!-- Toe pads -->
  <ellipse cx="345" cy="410" rx="52" ry="65" fill="url(#paw)" transform="rotate(-15, 345, 410)"/>
  <ellipse cx="450" cy="340" rx="50" ry="65" fill="url(#paw)" transform="rotate(-5, 450, 340)"/>
  <ellipse cx="575" cy="340" rx="50" ry="65" fill="url(#paw)" transform="rotate(5, 575, 340)"/>
  <ellipse cx="680" cy="410" rx="52" ry="65" fill="url(#paw)" transform="rotate(15, 680, 410)"/>
</svg>
