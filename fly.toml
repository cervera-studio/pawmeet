# fly.toml app configuration file generated for pawmeet-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pawmeet-api'
primary_region = 'fra'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
