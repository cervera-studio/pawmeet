name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/api/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-api.yml

permissions:
  contents: read
  deployments: write
  id-token: write # Required for Azure OIDC login

concurrency:
  group: deploy-api
  cancel-in-progress: true

env:
  ACR_NAME: crpawmeetprod
  IMAGE_NAME: pawmeet-api
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v4

      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # ── Database migrations (same as before) ──────────────────
      - name: Run DB migrations
        run: cd packages/db && pnpm dlx tsx src/migrate.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Apply post-migration indexes
        run: node packages/db/scripts/post-migrate.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # ── Set release version ───────────────────────────────────
      - name: Set release version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "RELEASE_VERSION=pawmeet-api@${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"

      # ── Azure login (OIDC — no stored credentials) ────────────
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Build & push Docker image to ACR ──────────────────────
      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"
          docker build \
            --file apps/api/Dockerfile \
            --build-arg "APP_VERSION=${RELEASE_VERSION}" \
            --tag "${FULL_IMAGE}:${IMAGE_TAG}" \
            --tag "${FULL_IMAGE}:latest" \
            .
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"

      # ── Deploy to Container Apps ──────────────────────────────
      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-pawmeet-api-prod \
            --resource-group rg-pawmeet-prod \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

      # ── Verify new revision is healthy ────────────────────────
      - name: Health check
        run: |
          echo "Waiting 30s for new revision to start..."
          sleep 30
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://api.pawmeet.io/health)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed (attempt $i)"
              exit 0
            fi
            echo "⏳ Attempt $i: got HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check failed after 5 attempts"
          az containerapp revision list \
            --name ca-pawmeet-api-prod \
            --resource-group rg-pawmeet-prod \
            --query "[0:3].{name:name,active:properties.active,healthy:properties.runningState}" \
            -o table
          exit 1

      # ── Sentry release ────────────────────────────────────────
      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli@3.3.3 releases new "${RELEASE_VERSION}"
          npx @sentry/cli@3.3.3 releases set-commits "${RELEASE_VERSION}" --local
          npx @sentry/cli@3.3.3 releases deploys "${RELEASE_VERSION}" new -e production
          npx @sentry/cli@3.3.3 releases finalize "${RELEASE_VERSION}"
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_API }}
