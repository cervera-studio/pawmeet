name: Terraform

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform.yml
  push:
    branches: [main]
    paths:
      - infra/**
      - .github/workflows/terraform.yml

permissions:
  contents: read
  pull-requests: write
  id-token: write # Required for Azure OIDC login

concurrency:
  group: terraform
  cancel-in-progress: false # Never cancel an in-progress apply

env:
  TF_DIR: infra
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  # Terraform variables passed as TF_VAR_*
  TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_api_secrets: ${{ secrets.TF_API_SECRETS }}
  TF_VAR_admin_secrets: ${{ secrets.TF_ADMIN_SECRETS }}

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.5"

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        run: terraform plan -no-color -out=tfplan 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Read plan output
        id: read-plan
        working-directory: ${{ env.TF_DIR }}
        run: |
          # Truncate to stay within GitHub comment limits
          head -c 60000 plan.txt > plan-truncated.txt
          {
            echo "PLAN<<PLAN_EOF"
            cat plan-truncated.txt
            echo "PLAN_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v7
        env:
          PLAN: ${{ steps.read-plan.outputs.PLAN }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const icon = process.env.PLAN_OUTCOME === 'success' ? '✅' : '❌';
            const body = [
              `### Terraform Plan (${icon})`,
              '',
              '<details>',
              '<summary>Click to expand</summary>',
              '',
              '```',
              process.env.PLAN,
              '```',
              '',
              '</details>',
              '',
              `*Pushed by @${process.env.ACTOR}, Action: \`${process.env.EVENT_NAME}\`*`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body?.includes('### Terraform Plan')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - uses: hashicorp/setup-terraform@5e8dbf3c6d9deaf4193ca7a8fb23f2ac83bb6c85 # v4.0.0
        with:
          terraform_version: "~> 1.5"

      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -backend-config=backend.hcl

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        run: terraform apply -auto-approve
