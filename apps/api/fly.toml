# fly.toml app configuration file generated for pawmeet-api
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'pawmeet-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 2

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[vm]]
  size = 'performance-1x'
  memory = '1gb'
