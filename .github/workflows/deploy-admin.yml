name: Deploy Admin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - apps/admin/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/deploy-admin.yml

permissions:
  contents: read
  deployments: write
  id-token: write # Required for Azure OIDC login

concurrency:
  group: deploy-admin
  cancel-in-progress: true

env:
  ACR_NAME: crpawmeetprod
  IMAGE_NAME: pawmeet-admin
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v4
        with:
          fetch-depth: 0

      # ── Set release version ───────────────────────────────────
      - name: Set release version
        run: |
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "RELEASE_VERSION=pawmeet-admin@${SHORT_SHA}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${SHORT_SHA}" >> "$GITHUB_ENV"

      # ── Azure login (OIDC — no stored credentials) ────────────
      - uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ── Build & push Docker image to ACR ──────────────────────
      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          FULL_IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_NAME}"
          docker build \
            --file apps/admin/Dockerfile \
            --build-arg "APP_VERSION=${IMAGE_TAG}" \
            --build-arg "NEXT_PUBLIC_API_URL=${ADMIN_API_URL}" \
            --build-arg "NEXT_PUBLIC_ADMIN_URL=https://den.pawmeet.io" \
            --build-arg "NEXT_PUBLIC_SENTRY_DSN=${ADMIN_SENTRY_DSN}" \
            --tag "${FULL_IMAGE}:${IMAGE_TAG}" \
            --tag "${FULL_IMAGE}:latest" \
            .
        env:
          ADMIN_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          ADMIN_SENTRY_DSN: ${{ vars.ADMIN_SENTRY_DSN }}
          docker push "${FULL_IMAGE}:${IMAGE_TAG}"
          docker push "${FULL_IMAGE}:latest"

      # ── Deploy to Container Apps ──────────────────────────────
      - name: Deploy new revision
        run: |
          az containerapp update \
            --name ca-pawmeet-admin-prod \
            --resource-group rg-pawmeet-prod \
            --image "${ACR_NAME}.azurecr.io/${IMAGE_NAME}:${IMAGE_TAG}"

      # ── Sentry release ────────────────────────────────────────
      - name: Create Sentry release
        if: env.SENTRY_AUTH_TOKEN != ''
        run: |
          npx @sentry/cli@3.3.3 releases new "${RELEASE_VERSION}"
          npx @sentry/cli@3.3.3 releases set-commits "${RELEASE_VERSION}" --auto
          npx @sentry/cli@3.3.3 releases deploys "${RELEASE_VERSION}" new -e production
          npx @sentry/cli@3.3.3 releases finalize "${RELEASE_VERSION}"
        env:
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_ADMIN }}
